[package]
name = "patchbay-desktop"
version = "2.0.0"
description = "Patchbay finite state studio"
authors = ["Patchbay"]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "patchbay_desktop"

[[bin]]
name = "Patchbay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
patchbay-core = { path = "../crates/patchbay-core" }
tauri = { version = "=2.12.3", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rfd = { version = "=0.17.2", default-features = false }
xcap = "=0.9.8"
rusty-leveldb = "=4.0.1"
tokio = { version = "=1.53.3", features = ["sync"] }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "=0.8.1"
windows-version = "=0.1.7"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
