[package]
name = "patchbay-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.99"
description = "Independent Patchbay automata domain and compatible graph project format"
license = "MIT"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

